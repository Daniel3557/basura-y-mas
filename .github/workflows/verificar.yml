# ============================================================
# BASURA Y MÁS · Verificación automática
# Proyecto FILOSOFARTE · Filosofía II · CBTis 226
# ------------------------------------------------------------
# Corre el E2E contra Supabase en cada push y en cada pull request.
#
# IMPORTANTE · este workflow necesita un secreto:
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_PUBLISHABLE_KEY  (la clave sb_publishable_... o anon)
#
# Sin ese secreto el workflow falla a propósito y avisa: no se
# ejecuta contra una base de datos inventada ni se saltan las
# comprobaciones.
#
# OJO · el E2E crea datos de prueba en la nube. Se ejecutan al
# terminar; los ids empiezan por 'e2e-' y el equipo los borra del
# SQL Editor cuando toca (las tablas no tienen política de borrado
# para el cliente, por seguridad).
# ============================================================
name: Verificar BASURA Y MÁS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobaciones:
    name: Sintaxis, coherencia y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Copiar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'none'

      # ── Comprobaciones que no necesitan red ─────────────────────
      - name: Sintaxis de app.js y sw.js
        run: node --check app.js && node --check sw.js

      - name: index.html no lleva CSS ni JS incrustados
        run: |
          set -e
          if grep -q '<style>' index.html; then
            echo "::error::index.html vuelve a llevar un <style> incrustado (rompe la CSP). Muévelo a estilos.css."
            exit 1
          fi
          if grep -qE '<script>[^<]' index.html; then
            echo "::error::index.html vuelve a llevar un <script> incrustado (rompe la CSP). Muévelo a app.js."
            exit 1
          fi
          echo "OK: sin estilos ni scripts incrustados."

      - name: Archivos referenciados existen
        run: |
          set -e
          for f in estilos.css app.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png; do
            test -f "$f" || { echo "::error::falta $f"; exit 1; }
          done
          grep -q "'./estilos.css'" sw.js || { echo "::error::sw.js no precarga estilos.css"; exit 1; }
          grep -q "'./app.js'" sw.js || { echo "::error::sw.js no precarga app.js"; exit 1; }
          echo "OK: el service worker precarga todo lo nuevo."

      - name: JSON válidos
        run: |
          set -e
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "
            const fs=require('fs');const h=fs.readFileSync('index.html','utf8');
            const m=h.match(/<script type=\"application\\/ld\\+json\">([\s\S]*?)<\\/script>/);
            if(!m){console.error('::error::falta el JSON-LD');process.exit(1)}
            JSON.parse(m[1]);console.log('OK: JSON-LD válido.');
          "

      - name: La CSP cubre lo que la app realmente usa
        run: |
          set -e
          node -e "
            const fs=require('fs');
            const v=JSON.parse(fs.readFileSync('vercel.json','utf8'));
            const csp=(v.headers[0].headers.find(h=>h.key==='Content-Security-Policy')||{}).value||'';
            const obligatorios=['https://unpkg.com','fonts.googleapis.com','fonts.gstatic.com','*.supabase.co',
              '*.tile.openstreetmap.org','router.project-osrm.org','nominatim.openstreetmap.org','api.mapbox.com'];
            const falta=obligatorios.filter(d=>!csp.includes(d));
            if(falta.length){console.error('::error::la CSP no menciona: '+falta.join(', '));process.exit(1)}
            if(csp.includes(\"'unsafe-eval'\")){console.error('::error::la CSP no debe permitir unsafe-eval');process.exit(1)}
            if(!/script-src[^;]*'self'/.test(csp)){console.error('::error::script-src no incluye self');process.exit(1)}
            console.log('OK: la CSP cubre todos los orígenes que usa la app.');
          "

      # ── E2E real contra Supabase ───────────────────────────────
      - name: Comprobar el secreto de Supabase
        id: secreto
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::falta el secreto SUPABASE_PUBLISHABLE_KEY en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::add-mask::${SUPABASE_PUBLISHABLE_KEY}"

      - name: E2E contra Supabase
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tests/e2e-supabase.js