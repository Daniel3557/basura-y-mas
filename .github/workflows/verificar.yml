# ============================================================
# BASURA Y MÁS · Verificación automática
# Proyecto FILOSOFARTE · Filosofía II · CBTis 226
# ------------------------------------------------------------
# Corre el E2E contra Supabase en cada push y en cada pull request.
#
# IMPORTANTE · este workflow necesita un secreto:
#   Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_PUBLISHABLE_KEY  (la clave sb_publishable_... o anon)
#
# Sin ese secreto el workflow falla a propósito y avisa: no se
# ejecuta contra una base de datos inventada ni se saltan las
# comprobaciones.
#
# OJO · el E2E crea datos de prueba en la nube. Se ejecutan al
# terminar; los ids empiezan por 'e2e-' y el equipo los borra del
# SQL Editor cuando toca (las tablas no tienen política de borrado
# para el cliente, por seguridad).
# ============================================================
name: Verificar BASURA Y MÁS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobaciones:
    name: Sintaxis, coherencia y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Este proyecto no tiene package.json, así que setup-node no debe intentar
      # cachear nada. No se pone `cache`: se Omite. Decir cache: 'none' hace
      # que setup-node@v5 lo lea como el nombre de un gestor de paquetes y
      # aborte ("No se admite la caché para 'none'"), y el job se cae ANTES
      # de ejecutar ninguna comprobación. Sin ese campo, la caché ya está
      # apagada.
      - name: Copiar el repositorio
        uses: actions/checkout@v5

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ── Comprobaciones que no necesitan red ─────────────────────
      - name: Sintaxis de app.js y sw.js
        run: node --check app.js && node --check sw.js

      - name: Sintaxis de la función /api/eco y de sus herramientas
        run: node --check api/eco.js && node --check tools/dev-server.js && node --check tests/eco-api.js && node --check tests/eco-reglas.js && node --check tests/sw-cache.js && node --check tests/sw-cache-atrapa.js && node --check tests/red-ciudad.js

      - name: La clave de la IA no está en el repositorio
        run: |
          set -e
          # /api/eco lee NVIDIA_API_KEY del entorno del servidor. Si algún día
          # alguien pega una clave en app.js, en un HTML o en vercel.json, la
          # clave queda pública para todo el mundo: esto lo para.
          if git ls-files -z | xargs -0 grep -lE 'nvapi-[A-Za-z0-9_-]{16,}|sb_secret_[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9_-]{20,}' 2>/dev/null; then
            echo "::error::hay una clave de API versionada. Quítala, rótala en el proveedor y usa la variable de entorno NVIDIA_API_KEY."
            exit 1
          fi
          if [ -f .env ]; then
            echo "::error::.env no debe estar en el repositorio (está en .gitignore; revisa si se llegó a commitear)."
            exit 1
          fi
          grep -q 'process.env.NVIDIA_API_KEY' api/eco.js || {
            echo "::error::api/eco.js debe leer la clave de process.env, nunca tenerla escrita."; exit 1; }
          echo "OK: no hay ninguna clave de IA en el repositorio."

      - name: /api/eco aguanta sus propias defensas
        run: node tests/eco-api.js

      - name: Las cuentas de Eco las hace la app, no el modelo
        run: |
          set -e
          node tests/eco-reglas.js
          # Si alguien mete un eval en la calculadora, deja de ser una cuenta
          # y pasa a ser código del sitio: esto lo para.
          if sed -n '/function ecoCalcular/,/^}/p' app.js | grep -qE 'eval\(|new Function'; then
            echo "::error::ecoCalcular no puede usar eval ni Function: es una calculadora, no un intérprete."
            exit 1
          fi
          echo "OK: la calculadora y el simulador son aritmética pura."

      - name: La CSP no se abre para la IA
        run: |
          set -e
          # El modelo se llama desde el servidor, no desde el navegador: si
          # alguien añade el dominio del proveedor a connect-src, la clave
          # tendría que estar en el cliente para poder usarla.
          if grep -E 'integrate\.api\.nvidia|openai\.com|anthropic\.com|generativelanguage\.googleapis' vercel.json; then
            echo "::error::la IA se llama desde /api/eco, no desde el navegador. No abras la CSP a esos dominios."
            exit 1
          fi
          echo "OK: la IA no necesita abrir la CSP."

      - name: index.html no lleva CSS ni JS incrustados
        run: |
          set -e
          if grep -q '<style>' index.html; then
            echo "::error::index.html vuelve a llevar un <style> incrustado (rompe la CSP). Muévelo a estilos.css."
            exit 1
          fi
          if grep -qE '<script>[^<]' index.html; then
            echo "::error::index.html vuelve a llevar un <script> incrustado (rompe la CSP). Muévelo a app.js."
            exit 1
          fi
          echo "OK: sin estilos ni scripts incrustados."

      - name: El módulo Eco no usa HTML ni código peligroso
        run: |
          set -e
          for patron in 'innerHTML *=' 'document\.write' 'eval\(' 'new Function' 'insertAdjacentHTML'; do
            if sed -n '/MÓDULO 23/,/^})();/p' app.js | grep -nE "$patron"; then
              echo "::error::el módulo Eco usa $patron: lo que escribe el usuario nunca se interpreta como código."
              exit 1
            fi
          done
          echo "OK: Eco pinta todo con textContent."

      - name: Archivos referenciados existen
        run: |
          set -e
          for f in estilos.css app.js sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png api/eco.js; do
            test -f "$f" || { echo "::error::falta $f"; exit 1; }
          done
          grep -q "'./estilos.css'" sw.js || { echo "::error::sw.js no precarga estilos.css"; exit 1; }
          grep -q "'./app.js'" sw.js || { echo "::error::sw.js no precarga app.js"; exit 1; }
          grep -q "pathname.indexOf('/api/')" sw.js || {
            echo "::error::sw.js debe dejar pasar /api/ a la red: una respuesta del modelo no se cachea"; exit 1; }
          echo "OK: el service worker precarga todo lo nuevo."

      - name: La sincronización no puede reventar contra la nube
        run: |
          set -e
          # Sin normalizar el usuario_id, sin sesión se enviaba el id de
          # la cuenta con la que se creó en su día: la base de datos lo
          # rechazaba y la app lo reintentaba eternamente.
          grep -q 'copia.usuario_id = (sesion.usuario && sesion.usuario.id) || null' app.js || {
            echo "::error::upsertNube debe normalizar siempre usuario_id (si no, reintentos infinitos con 401)."; exit 1; }
          # Sin la marca _pendiente, lo borrado en la nube reaparece: cada
          # arranque volvía a subir todo lo que hubiera en el dispositivo.
          grep -q 'p._pendiente && !esperaDemasiado(p)' app.js || {
            echo "::error::la sincronización de publicaciones debe filtrar por _pendiente."; exit 1; }
          grep -q 'x._pendiente && !esperaDemasiado(x)' app.js || {
            echo "::error::la sincronización de reportes debe filtrar por _pendiente."; exit 1; }
          echo "OK: la sincronización no puede entrar en bucle ni resucitar contenido borrado."

      - name: JSON válidos
        run: |
          set -e
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "
            const fs=require('fs');const h=fs.readFileSync('index.html','utf8');
            const m=h.match(/<script type=\"application\\/ld\\+json\">([\s\S]*?)<\\/script>/);
            if(!m){console.error('::error::falta el JSON-LD');process.exit(1)}
            JSON.parse(m[1]);console.log('OK: JSON-LD válido.');
          "

      - name: La CSP cubre lo que la app realmente usa
        run: |
          set -e
          node -e "
            const fs=require('fs');
            const v=JSON.parse(fs.readFileSync('vercel.json','utf8'));
            const csp=(v.headers[0].headers.find(h=>h.key==='Content-Security-Policy')||{}).value||'';
            const obligatorios=['https://unpkg.com','fonts.googleapis.com','fonts.gstatic.com','*.supabase.co',
              '*.tile.openstreetmap.org','router.project-osrm.org','nominatim.openstreetmap.org','api.mapbox.com'];
            const falta=obligatorios.filter(d=>!csp.includes(d));
            if(falta.length){console.error('::error::la CSP no menciona: '+falta.join(', '));process.exit(1)}
            if(csp.includes(\"'unsafe-eval'\")){console.error('::error::la CSP no debe permitir unsafe-eval');process.exit(1)}
            if(!/script-src[^;]*'self'/.test(csp)){console.error('::error::script-src no incluye self');process.exit(1)}
            console.log('OK: la CSP cubre todos los orígenes que usa la app.');
          "

      - name: El service worker no esconde las actualizaciones
        run: |
          set -e
          # Este fue un bug real: app.js se servía caché-primero y el
          # navegador entregaba la versión vieja, así que las colonias
          # nuevas no aparecían hasta la segunda recarga.
          node tests/sw-cache.js
          # Y esta segunda capa es la importante: comprueba que la prueba
          # anterior sigue sirviendo, reintroduciendo el bug en una copia
          # temporal y exigiendo que la prueba falle.
          node tests/sw-cache-atrapa.js
          echo "OK: app.js y estilos.css llegan por red en la primera recarga."

      - name: La red urbana de puntos reparte bien
        run: |
          set -e
          # Puntos cada 400 m sobre las calles reales de TODA la ciudad.
          # Prueba el encadenado de tramos de OSM, que las calles paralelas
          # no se borren entre sí y que cada punto se etiquete como
          # "propuesto por el sistema" (no es un contenedor confirmado).
          node tests/red-ciudad.js
          echo "OK: el reparto de la red urbana es correcto."

      # ── E2E real contra Supabase ───────────────────────────────
      - name: Comprobar el secreto de Supabase
        id: secreto
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::falta el secreto SUPABASE_PUBLISHABLE_KEY en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::add-mask::${SUPABASE_PUBLISHABLE_KEY}"

      - name: E2E contra Supabase
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tests/e2e-supabase.js